<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワードをお忘れの方 — PatternForge</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "_nav.html" %}
  {% include "_flash.html" %}

  <main class="container narrow">
    <section class="panel">
      <h2>パスワードの再設定</h2>
      <p class="hint">登録済みのメールアドレスを入力してください。再設定用のリンクを送信します。</p>
      <form method="post" action="{{ url_for('forgot_password_submit') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
          <label for="forgot-email">メールアドレス</label>
          <input type="email" id="forgot-email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" class="primary">再設定メールを送信する</button>
      </form>
      <p class="hint" style="margin-top:14px;">
        <a href="{{ url_for('login') }}">ログイン画面に戻る</a>
      </p>
    </section>
  </main>

  {% include "_footer.html" %}
</body>
</html>
