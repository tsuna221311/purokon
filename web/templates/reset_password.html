<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワードの再設定 — PatternForge</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "_nav.html" %}
  {% include "_flash.html" %}

  <main class="container narrow">
    <section class="panel">
      <h2>新しいパスワードを設定</h2>
      <form method="post" action="{{ url_for('reset_password_submit', token=token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
          <label for="reset-password">新しいパスワード（8文字以上）</label>
          <input type="password" id="reset-password" name="password" minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="primary">パスワードを再設定する</button>
      </form>
    </section>
  </main>

  {% include "_footer.html" %}
  <script src="{{ url_for('static', filename='password_toggle.js') }}"></script>
</body>
</html>
