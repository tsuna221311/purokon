services:
  - type: web
    name: patternforge-demo
    runtime: python
    plan: free
    branch: codex/patternforge-quality-20261007
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --bind 0.0.0.0:$PORT --timeout 120 wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PATTERNFORGE_FORCE_HTTPS
        value: "1"
      - key: PATTERNFORGE_DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.13.4
